name: Cover art

# The games come from a Google Sheet that changes without touching this repo,
# so new games sit on the shelf as blank boxes until covers.json catches up.
# This fetches what is missing and commits it.

on:
  schedule:
    - cron: '17 6 * * 1'   # Monday morning, before the week's games night
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Re-fetch every cover, not just the missing ones'
        type: boolean
        default: false
  push:
    paths:
      - 'tools/fetch-covers.mjs'
      - 'src/app/list.service.ts'   # the sheet URL lives here

concurrency:
  group: covers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch missing covers
        shell: bash   # for pipefail: a failed fetch must not be masked by tee
        run: node tools/fetch-covers.mjs ${{ inputs.refresh && '--refresh' || '' }} | tee "$RUNNER_TEMP/fetch.log"

      - name: Commit and push
        run: |
          if git diff --quiet -- src/assets/covers.json; then
            echo "covers.json is up to date — nothing to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/covers.json
          git commit -m 'Cover art: refresh covers.json from BGG' \
                     -m 'Fetched by the Cover art workflow for games added to the sheet.'
          git push origin HEAD:${{ github.ref_name }}

          {
            echo "Committed refreshed cover art to \`${{ github.ref_name }}\`."
            echo
            echo '```'
            tail -n 3 "$RUNNER_TEMP/fetch.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
